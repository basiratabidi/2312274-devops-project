##
## /etc/nginx/sites-available/devops
##
## Serves the static frontend on port 80
## Proxies API calls to FastAPI on port 8000
## HTTPS-ready (swap in your cert lines when you add a domain)
##

server {
    listen 80;
    server_name _;          # replace _ with your EC2 IP or domain

    # ── Static frontend ────────────────────────────────────────────
    root /home/ubuntu/devops-project/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy ──────────────────────────────────────────────────
    # All requests that start with /students, /health, /docs, /openapi
    # are forwarded to FastAPI running on port 8000.

    location ~ ^/(students|health|docs|openapi\.json|redoc|logs) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;

        # CORS headers (belt-and-suspenders; FastAPI also sends them)
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── Security headers ───────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff";
    add_header X-Frame-Options         "DENY";
    add_header Referrer-Policy         "strict-origin-when-cross-origin";

    # ── Gzip ───────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/html text/css application/javascript application/json;
    gzip_min_length 1024;
}
